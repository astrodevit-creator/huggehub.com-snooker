<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="innerWhite" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Pool/Snooker 8-Ball Body -->
  <circle cx="256" cy="256" r="160" fill="url(#ballShine)" filter="url(#shadow)" stroke="#334155" stroke-width="4" />

  <!-- White Center Disc -->
  <circle cx="256" cy="256" r="76" fill="url(#innerWhite)" />

  <!-- 8 Digit Graphic -->
  <text x="256" y="292" font-family="'Outfit', system-ui, -apple-system, sans-serif" font-size="112" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="-2">8</text>

  <!-- Specular Reflection Highlight -->
  <ellipse cx="205" cy="180" rx="42" ry="24" transform="rotate(-30 205 180)" fill="#ffffff" opacity="0.22" />

  <!-- Small Corner Star Accents -->
  <circle cx="120" cy="120" r="4" fill="#a5b4fc" opacity="0.8" />
  <circle cx="392" cy="120" r="4" fill="#a5b4fc" opacity="0.8" />
  <circle cx="120" cy="392" r="4" fill="#a5b4fc" opacity="0.8" />
  <circle cx="392" cy="392" r="4" fill="#a5b4fc" opacity="0.8" />
</svg>
